<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chapter after target-text shrink</title>
    <style>
      @page {
        size: 80px 84px;
        margin: 0;
        counter-reset: chapter-page 0;
        counter-increment: chapter-page;
      }
      p {
        margin: 0;
        inline-size: 100%;
        font: 16px / 1 monospace;
      }
      #target::after {
        content: " page=" counter(page) " custom=" counter(chapter-page);
      }
    </style>
  </head>
  <body>
    <p id="target">a</p>
  </body>
</html>
