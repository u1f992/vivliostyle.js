<!doctype html>
<!-- Expected: three pages; page 2 stays blank and #target sits on page 3 with the reference settled as "S". -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>target-counter layout oscillation across spines</title>
    <style>
      @page {
        size: 160px 68px;
        margin: 0;
      }
      @counter-style oscillate {
        system: fixed;
        symbols: "A" "L\A L\A L\A L\A L" "S";
        suffix: "";
      }
      * {
        margin: 0;
      }
      html {
        font: 16px / 16px monospace;
        widows: 1;
        orphans: 1;
      }
      .ref::before {
        content: target-counter(attr(data-href), page, oscillate);
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div class="ref" data-href="chapter.html#target"></div>
  </body>
</html>
